<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABP - M4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/css/style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- script de moment.js -->
    <script defer src="https://momentjs.com/downloads/moment-with-locales.js"></script>

    <script defer type="module" src="./assets/js/script.js"></script>
</head>

<body>

    <header class="py-3">
        <h1 class="text-center">APP Task Flow</h1>
    </header>

    <main class="container">

        <section>
            <h2>Agrega una nueva tarea</h2>
            <form id="form-add-tarea">
                <div class="mb-3">
                    <input type="text" class="form-control" name="descripcion" id="input-descripcion-tarea"
                        placeholder="Introduce la descripción..." required>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary">Agregar Tarea</button>
                </div>
            </form>
        </section>

        <section class="py-3">
            <h2 class="text-center">Listado de taras</h2>

            <div class="py-3">
                <table class="table" id="tabla-tareas">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Fecha creación</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- AQUÍ SE AGREGAN LAS TAREAS DE FORMA DINÁMICA -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

</body>

</html>
