<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4-Ejercicio-Clases</title>

    <script type="module" defer src="./assets/js/script.js"></script>
</head>

<body>

    <header>
        <h1>Mantenedor de Usuarios</h1>
    </header>

    <main>
        <section>
            <h2>Formulario de creación de usuarios.</h2>

            <form id="formAddUsuario">
                <div>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombreInput" required>
                </div>
                <div>
                    <label for="apellido">Apellido:</label>
                    <input type="text" name="apellido" id="apellidoInput" required>
                </div>
                <div>
                    <label for="run">RUN:</label>
                    <input type="text" name="run" id="runInput" required>
                </div>
                <div>
                    <button type="submit">Crear</button>
                </div>
            </form>
        </section>

        <section>
            <h2>Lista de usuarios</h2>
            <ul id="listadoUsuarios">

            </ul>
        </section>
    </main>


</body>

</html>
